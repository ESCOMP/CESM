on:
  push:
    branches: [ cesm3.0-alphabranch ]
  pull_request:
    branches: [ cesm3.0-alphabranch ]
jobs:
  fleximod-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # oldest supported and latest supported
        include:
          # setup-python has no 3.7 builds for Ubuntu newer than 22.04
          - python-version: "3.7"
            os: ubuntu-22.04
          - python-version: "3.x"
            os: ubuntu-latest
    steps:
      - id: checkout-CESM
        uses: actions/checkout@v4
      - id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{matrix.python-version}}
      - id: run-fleximod
        run: |
          $GITHUB_WORKSPACE/bin/git-fleximod update -o
          echo
          echo "Update complete, checking status"
          echo
          $GITHUB_WORKSPACE/bin/git-fleximod test
      - id: check-cleanliness
        run: |
          echo
          echo "Checking if git fleximod matches expected externals"
          echo
          git add . && git diff --exit-code && git diff --cached --exit-code
